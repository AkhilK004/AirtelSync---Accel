[project]
name = "udyam-api"
version = "0.1.0"
description = "Udyam Digital API"
readme = "README.md"
authors = [
    { name = "Akhil", email = "rishusonkar1526@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "google-cloud-firestore>=2.34.1",
    "google-cloud-storage>=3.17.1",
    "google-genai>=3.0.0",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-dateutil>=4.0.0",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]


[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "plotly>=7.1.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
