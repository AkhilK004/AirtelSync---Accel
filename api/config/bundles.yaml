# Bundle templates per segment. SKUs reference product_catalogue.csv ids only (no prices here).
# Composition and quantities are informed by what activated leads actually bought (docs/assumptions.md A13).
# candidates: ordered tiers; fallback:true are used only when no regular tier is eligible. fits_up_to = max employees the tier suits; requires_fibre=true skips if site has no fibre.
# qty kinds: fixed{n} | sites | sites_x{n} | employees_ratio{ratio,min,max}
micro_retail:
  name: {en: "Dukaan Starter", hi: "दुकान स्टार्टर", mr: "दुकान स्टार्टर"}
  needs:
    - {need: connectivity, required: true, candidates: [{sku: P01, fits_up_to: 999, requires_fibre: true}, {sku: P04, fits_up_to: 999, fallback: true}], qty: {kind: sites}}
    - {need: business_sim, required: true, candidates: [{sku: P07, fits_up_to: 999}], qty: {kind: employees_ratio, ratio: 0.5, min: 1, max: 4}}
    - {need: billing_pos, required: false, default_on: false, candidates: [{sku: P19, fits_up_to: 999}], qty: {kind: fixed, n: 1}}
    - {need: customer_messaging, required: false, default_on: false, candidates: [{sku: P15, fits_up_to: 999}], qty: {kind: fixed, n: 1}}
    - {need: guest_wifi, required: false, default_on: false, candidates: [{sku: P22, fits_up_to: 999}], qty: {kind: sites}}
    - {need: cctv, required: false, default_on: false, candidates: [{sku: P23, fits_up_to: 999}], qty: {kind: fixed, n: 2}}
    - {need: website, required: false, default_on: false, candidates: [{sku: P18, fits_up_to: 999}], qty: {kind: fixed, n: 1}}
