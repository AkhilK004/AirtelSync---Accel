    - {need: business_sim, required: true, candidates: [{sku: P07, fits_up_to: 999}], qty: {kind: employees_ratio, ratio: 0.33, min: 2, max: 6}}
    - {need: cloud_email, required: true, candidates: [{sku: P16, fits_up_to: 999}], qty: {kind: employees_ratio, ratio: 1.0, min: 1, max: 40}}
    - {need: security, required: true, candidates: [{sku: P20, fits_up_to: 999}], qty: {kind: employees_ratio, ratio: 1.0, min: 1, max: 40}}
    - {need: backup, required: false, default_on: false, candidates: [{sku: P17, fits_up_to: 999}], qty: {kind: fixed, n: 1}}
    - {need: failover, required: false, default_on: false, candidates: [{sku: P09, fits_up_to: 999}], qty: {kind: sites}}
    - {need: static_ip, required: false, default_on: false, candidates: [{sku: P11, fits_up_to: 999}], qty: {kind: fixed, n: 1}}
    - {need: business_phone, required: false, default_on: false, candidates: [{sku: P12, fits_up_to: 999}], qty: {kind: employees_ratio, ratio: 0.2, min: 2, max: 6}}
    - {need: cctv, required: false, default_on: false, candidates: [{sku: P23, fits_up_to: 999}], qty: {kind: fixed, n: 4}}
    - {need: guest_wifi, required: false, default_on: false, candidates: [{sku: P22, fits_up_to: 999}], qty: {kind: sites}}
